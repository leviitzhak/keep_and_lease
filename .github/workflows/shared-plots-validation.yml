name: Shared plot suite integration

on:
  push:
    branches: [agent/shared-run-plots]
    paths: [.cloud-agent/requests/shared-plots.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: shared-plots-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch and apply the reviewed UI correction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = agent/shared-run-plots
          git merge-base --is-ancestor 62d03527a8f71a297def7f1de69d2de48360b553 HEAD
          python -c 'import json; assert json.load(open(".cloud-agent/requests/shared-plots.json"))["mode"] == "ui-fix-and-preview"'
          python .cloud-agent/requests/shared-ui.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate canonical assets
        run: |
          python -m pip install -r requirements-cloud.txt -r requirements-trade-data.txt httpx
          npm ci --ignore-scripts
          npm run prepare:assets
      - name: Numerical, replay, recovery and API regressions
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_shared_run_plots tests.test_todo_small_batch tests.test_benchmark_gui tests.test_audit_limits tests.test_backtest_history tests.test_server_api tests.test_benchmark_segments tests.test_replay_extension tests.test_cloud_credential_retry tests.test_trade_discrepancies tests.test_benchmark_chain tests.test_trade_range_recovery tests.test_trade_resume_service tests.test_btc_trade_backtest tests.test_trade_data_store tests.test_trade_replay tests.test_backtest_audit tests.test_cloud_jobs tests.test_trade_data_upload tests.test_current_runtime_improvements -v 2>&1 | tee shared-python.log
      - name: Production build and all JavaScript regressions
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee shared-build.log
          node --test tests/*.test.mjs 2>&1 | tee shared-javascript.log
          node --check scripts/cloud-agent-browser.cjs
          cmp shared-run-plots.js public/shared-run-plots.js
          cmp silver_strategy_gui.html public/silver_strategy_gui.html
          cmp backtest-runs.js public/backtest-runs.js
      - name: Commit only the combined validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git diff --cached --stat | tee shared-changes.log
          git commit -m 'fix: release replaced plot canvases and preserve chart inspection [skip ci]'
          git push origin HEAD:agent/shared-run-plots
          git rev-parse HEAD | tee SOURCE_COMMIT.txt
      - name: Deploy this tested correction to private preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/agent/shared-run-plots | cut -f1)" = "$(git rev-parse HEAD)"
          gh workflow run deploy-google-cloud.yml --ref agent/shared-run-plots -f deployment_target=preview -f allow_unauthenticated=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-plots-validation-${{ github.run_id }}
          path: |
            shared-*.log
            SOURCE_COMMIT.txt
          if-no-files-found: warn
          retention-days: 7
