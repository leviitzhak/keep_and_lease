name: Databento gold research validation

on:
  push:
    paths:
      - scripts/databento_gold.py
      - tests/test_databento_gold.py
      - strategies/research-1oz-dec26-september.json
      - requirements-databento.txt
      - .github/workflows/databento-gold-validation.yml
  pull_request:
    paths:
      - scripts/databento_gold.py
      - tests/test_databento_gold.py
      - strategies/research-1oz-dec26-september.json
      - requirements-databento.txt
      - .github/workflows/databento-gold-validation.yml

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-databento.txt
      - run: python -m unittest discover -s tests -p 'test_databento_gold.py'
      - run: python scripts/databento_gold.py --help
