name: Deploy market-data SQLite cache preview

on:
  push:
    branches:
      - agent/market-data-sqlite-cache

concurrency:
  group: google-cloud-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$REGION"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/keep-and-lease"
          web_image="${registry}/web:${GITHUB_SHA}"
          worker_image="${registry}/worker:${GITHUB_SHA}"
          data_manifest_hash="$(
            sha256sum \
              gold_silver.zip si.zip gc.zip cl.zip w.zip c.zip s.zip sp.zip \
              DCOILWTICO.csv DGS1.csv DGS2.csv DGS3.csv DGS5.csv DTB3.csv DTB6.csv |
              sha256sum | cut -d' ' -f1
          )"
          {
            echo "registry=${registry}"
            echo "web_image=${web_image}"
            echo "worker_image=${worker_image}"
            echo "data_manifest_hash=${data_manifest_hash}"
          } >> "$GITHUB_OUTPUT"

      - name: Build immutable web and worker images
        env:
          WEB_IMAGE: ${{ steps.metadata.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
          DATA_MANIFEST_HASH: ${{ steps.metadata.outputs.data_manifest_hash }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --file Dockerfile.web \
            --build-arg "ENGINE_COMMIT=${GITHUB_SHA}" \
            --build-arg "DATA_MANIFEST_HASH=${DATA_MANIFEST_HASH}" \
            --build-arg "IMAGE_REF=${WEB_IMAGE}" \
            --tag "$WEB_IMAGE" . &
          web_pid=$!
          docker build \
            --file Dockerfile.worker \
            --build-arg "ENGINE_COMMIT=${GITHUB_SHA}" \
            --build-arg "DATA_MANIFEST_HASH=${DATA_MANIFEST_HASH}" \
            --build-arg "IMAGE_REF=${WORKER_IMAGE}" \
            --tag "$WORKER_IMAGE" . &
          worker_pid=$!
          wait "$web_pid"
          wait "$worker_pid"
          docker push "$WEB_IMAGE" &
          web_push_pid=$!
          docker push "$WORKER_IMAGE" &
          worker_push_pid=$!
          wait "$web_push_pid"
          wait "$worker_push_pid"

      - name: Resolve pushed image digests
        id: images
        env:
          WEB_TAG: ${{ steps.metadata.outputs.web_image }}
          WORKER_TAG: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          web_digest="$(gcloud artifacts docker images describe "$WEB_TAG" --format='value(image_summary.digest)')"
          worker_digest="$(gcloud artifacts docker images describe "$WORKER_TAG" --format='value(image_summary.digest)')"
          [[ "$web_digest" == sha256:* ]]
          [[ "$worker_digest" == sha256:* ]]
          web_image="${WEB_TAG%:*}@${web_digest}"
          worker_image="${WORKER_TAG%:*}@${worker_digest}"
          {
            echo "web_image=${web_image}"
            echo "worker_image=${worker_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Plan Cloud Run workload update
        working-directory: infra/gcp/workloads
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_web_image: ${{ steps.images.outputs.web_image }}
          TF_VAR_worker_image: ${{ steps.images.outputs.worker_image }}
          TF_VAR_allow_unauthenticated: true
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Apply Cloud Run workload update
        working-directory: infra/gcp/workloads
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_web_image: ${{ steps.images.outputs.web_image }}
          TF_VAR_worker_image: ${{ steps.images.outputs.worker_image }}
          TF_VAR_allow_unauthenticated: true
        run: terraform apply -input=false -auto-approve tfplan

      - name: Report failed Cloud Run startup logs
        if: failure()
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="keep-and-lease-web"' \
            --project="$PROJECT_ID" \
            --freshness=30m \
            --limit=100 \
            --order=desc \
            --format=json

      - name: Resolve deployed web URI
        id: web
        working-directory: infra/gcp/workloads
        run: echo "web_uri=$(terraform output -raw web_uri)" >> "$GITHUB_OUTPUT"

      - name: Mint Cloud Run identity token
        id: health_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.web.outputs.web_uri }}
          id_token_include_email: true

      - name: Verify private web health
        id: verify
        env:
          IDENTITY_TOKEN: ${{ steps.health_auth.outputs.id_token }}
          WEB_URI: ${{ steps.web.outputs.web_uri }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${IDENTITY_TOKEN}" \
            "${WEB_URI}/api/v1/health")"
          test "$(jq -r '.status' <<<"$health")" = "ok"
          test "$(jq -r '.execution_backend' <<<"$health")" = "cloud-run-job"
          echo "web_uri=${WEB_URI}" >> "$GITHUB_OUTPUT"
          jq . <<<"$health"

      - name: Publish deployment summary
        env:
          WEB_URI: ${{ steps.verify.outputs.web_uri }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
        run: |
          {
            echo "## Google Cloud deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Private web service: ${WEB_URI}"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Worker image: \`${WORKER_IMAGE}\`"
            echo "- Calculation Job: \`keep-and-lease-calculation\`"
          } >> "$GITHUB_STEP_SUMMARY"
