name: PRD six-level 0.6 BTC historical replay
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/prd-ladder-research.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: prd-ladder-research
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded request and execution invariants
        run: |
          PYTHONPATH=research/prd_ladder python -c 'from cloud_run import validate_request; validate_request()'
          python -m unittest discover -s research/prd_ladder -p test_replay.py -v
      - name: Install storage client
        run: python -m pip install 'google-cloud-storage>=2.18,<4'
      - uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Replay verified Dec26 and Mar27 trades
        run: python -u research/prd_ladder/cloud_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd-ladder-six-level-0.6-btc
          path: ladder-reports/
          retention-days: 30
          if-no-files-found: warn
