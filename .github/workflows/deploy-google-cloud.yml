name: Deploy Google Cloud workloads

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".cloud-agent/requests/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Stable working version or feature-branch preview
        required: true
        type: choice
        options:
          - preview
          - stable
        default: preview
      allow_unauthenticated:
        description: Expose the web GUI and API without Cloud Run IAM authentication
        required: true
        type: boolean
        default: false

concurrency:
  group: google-cloud-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'stable' || github.event_name == 'push' && 'preview' || inputs.deployment_target }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  replay-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay validation dependencies
        run: python -m pip install -r requirements-cloud.txt -r requirements-trade-data.txt httpx
      - name: Check multi-day accounting, recovery, Parquet and job APIs
        run: |
          python -c 'import pyarrow, fastapi'
          python -m unittest tests.test_benchmark_gui tests.test_audit_limits tests.test_backtest_history tests.test_server_api tests.test_benchmark_segments tests.test_replay_extension tests.test_cloud_credential_retry tests.test_trade_discrepancies tests.test_benchmark_chain tests.test_trade_range_recovery tests.test_trade_resume_service tests.test_btc_trade_backtest tests.test_trade_data_store tests.test_trade_replay tests.test_backtest_audit tests.test_cloud_jobs tests.test_trade_data_upload tests.test_current_runtime_improvements -v
  deploy:
    needs: replay-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IAP_ENABLED: ${{ vars.GCP_IAP_ENABLED == 'true' }}
      IAP_CLIENT_ID: ${{ vars.GCP_IAP_CLIENT_ID }}
      DEPLOYMENT_TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'stable' || github.event_name == 'push' && 'preview' || inputs.deployment_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate access configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            stable|preview) ;;
            *) echo "Invalid deployment target: $DEPLOYMENT_TARGET" >&2; exit 2 ;;
          esac
          if [[ "$DEPLOYMENT_TARGET" == "stable" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "The stable target may only be deployed from master." >&2
            exit 2
          fi
          if [[ "$IAP_ENABLED" == "true" ]]; then
            test -n "$IAP_CLIENT_ID"
          fi

      - name: Resolve immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$REGION"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/keep-and-lease"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "web_image=$registry/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_image=$registry/worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "engine_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          manifest_hash="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('public/data/market-data-manifest.json')
          if manifest.exists():
              value = json.loads(manifest.read_text(encoding='utf-8'))
              print(value.get('manifest_sha256', value.get('manifest_hash', 'unknown')))
          else:
              print('unknown')
          PY
          )"
          echo "data_manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build immutable web image
        run: |
          docker build \
            --build-arg ENGINE_COMMIT="${{ steps.metadata.outputs.engine_commit }}" \
            --build-arg DATA_MANIFEST_HASH="${{ steps.metadata.outputs.data_manifest_hash }}" \
            --build-arg IMAGE_REF="${{ steps.metadata.outputs.web_image }}" \
            -f Dockerfile.web \
            -t "${{ steps.metadata.outputs.web_image }}" .
          docker push "${{ steps.metadata.outputs.web_image }}"

      - name: Build immutable calculation worker image
        run: |
          docker build \
            --build-arg ENGINE_COMMIT="${{ steps.metadata.outputs.engine_commit }}" \
            --build-arg DATA_MANIFEST_HASH="${{ steps.metadata.outputs.data_manifest_hash }}" \
            --build-arg IMAGE_REF="${{ steps.metadata.outputs.worker_image }}" \
            -f Dockerfile.worker \
            -t "${{ steps.metadata.outputs.worker_image }}" .
          docker push "${{ steps.metadata.outputs.worker_image }}"

      - name: Select target names
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_TARGET" == "stable" ]]; then
            echo "web_service=keep-and-lease-web" >> "$GITHUB_OUTPUT"
            echo "worker_job=keep-and-lease-worker" >> "$GITHUB_OUTPUT"
            echo "firestore_collection=backtests" >> "$GITHUB_OUTPUT"
            echo "cache_collection=backtest_cache" >> "$GITHUB_OUTPUT"
          else
            echo "web_service=keep-and-lease-preview-web" >> "$GITHUB_OUTPUT"
            echo "worker_job=keep-and-lease-preview-worker" >> "$GITHUB_OUTPUT"
            echo "firestore_collection=backtests_preview" >> "$GITHUB_OUTPUT"
            echo "cache_collection=backtest_cache_preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Terraform deployment inputs
        shell: bash
        run: |
          cat > infra/gcp/deployment.auto.tfvars.json <<JSON
          {
            "project_id": "${PROJECT_ID}",
            "region": "${REGION}",
            "web_image": "${{ steps.metadata.outputs.web_image }}",
            "worker_image": "${{ steps.metadata.outputs.worker_image }}",
            "web_service_name": "${{ steps.target.outputs.web_service }}",
            "worker_job_name": "${{ steps.target.outputs.worker_job }}",
            "firestore_collection": "${{ steps.target.outputs.firestore_collection }}",
            "cache_collection": "${{ steps.target.outputs.cache_collection }}",
            "iap_enabled": ${IAP_ENABLED},
            "allow_unauthenticated": ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unauthenticated || false }}
          }
          JSON

      - name: Apply Cloud Run deployment
        working-directory: infra/gcp
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Resolve deployed URL
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${{ steps.target.outputs.web_service }}" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${DEPLOYMENT_TARGET}: $url"

      - name: Wait for authenticated health
        shell: bash
        env:
          URL: ${{ steps.deployed.outputs.url }}
        run: |
          set -euo pipefail
          token="$(gcloud auth print-identity-token --audiences="$IAP_CLIENT_ID")"
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer $token" "$URL/api/v1/health" || true)"
            if [[ "$code" == "200" ]]; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          cat /tmp/health.json || true
          exit 1

      - name: Authenticated rendered-GUI and calculation smoke test
        shell: bash
        env:
          URL: ${{ steps.deployed.outputs.url }}
        run: |
          set -euo pipefail
          token="$(gcloud auth print-identity-token --audiences="$IAP_CLIENT_ID")"
          python scripts/smoke-gcp-deployment.py --url "$URL" --identity-token "$token" --expected-commit "$GITHUB_SHA"

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          URL: ${{ steps.deployed.outputs.url }}
        run: |
          {
            echo "### Google Cloud deployment"
            echo "- Target: $DEPLOYMENT_TARGET"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: ${URL:-unavailable}"
            echo "- IAP: $IAP_ENABLED"
          } >> "$GITHUB_STEP_SUMMARY"
