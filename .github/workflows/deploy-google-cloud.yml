name: Deploy Google Cloud workloads

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Stable working version or feature-branch preview
        required: true
        type: choice
        options:
          - preview
          - stable
        default: preview
      allow_unauthenticated:
        description: Expose the web GUI and API without Cloud Run IAM authentication
        required: true
        type: boolean
        default: false

concurrency:
  group: google-cloud-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'stable' || github.event_name == 'push' && 'preview' || inputs.deployment_target }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IAP_ENABLED: ${{ vars.GCP_IAP_ENABLED == 'true' }}
      IAP_CLIENT_ID: ${{ vars.GCP_IAP_CLIENT_ID }}
      DEPLOYMENT_TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'stable' || github.event_name == 'push' && 'preview' || inputs.deployment_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate access configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            stable|preview) ;;
            *) echo "Invalid deployment target: $DEPLOYMENT_TARGET" >&2; exit 2 ;;
          esac
          if [[ "$DEPLOYMENT_TARGET" == "stable" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "The stable target may only be deployed from master." >&2
            exit 2
          fi
          if [[ "$IAP_ENABLED" == "true" ]]; then
            test -n "$IAP_CLIENT_ID"
          fi

      - name: Resolve immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$REGION"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/keep-and-lease"
          web_image="${registry}/web:${GITHUB_SHA}"
          worker_image="${registry}/worker:${GITHUB_SHA}"
          data_manifest_hash="$(
            sha256sum \
              gold_silver.zip si.zip gc.zip cl.zip w.zip c.zip s.zip sp.zip \
              DCOILWTICO.csv DGS1.csv DGS2.csv DGS3.csv DGS5.csv DTB3.csv DTB6.csv |
              sha256sum | cut -d' ' -f1
          )"
          {
            echo "registry=${registry}"
            echo "web_image=${web_image}"
            echo "worker_image=${worker_image}"
            echo "data_manifest_hash=${data_manifest_hash}"
          } >> "$GITHUB_OUTPUT"

      - name: Build immutable web and worker images
        env:
          WEB_IMAGE: ${{ steps.metadata.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
          DATA_MANIFEST_HASH: ${{ steps.metadata.outputs.data_manifest_hash }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --file Dockerfile.web \
            --build-arg "ENGINE_COMMIT=${GITHUB_SHA}" \
            --build-arg "DATA_MANIFEST_HASH=${DATA_MANIFEST_HASH}" \
            --build-arg "IMAGE_REF=${WEB_IMAGE}" \
            --tag "$WEB_IMAGE" . &
          web_pid=$!
          docker build \
            --file Dockerfile.worker \
            --build-arg "ENGINE_COMMIT=${GITHUB_SHA}" \
            --build-arg "DATA_MANIFEST_HASH=${DATA_MANIFEST_HASH}" \
            --build-arg "IMAGE_REF=${WORKER_IMAGE}" \
            --tag "$WORKER_IMAGE" . &
          worker_pid=$!
          wait "$web_pid"
          wait "$worker_pid"
          docker push "$WEB_IMAGE" &
          web_push_pid=$!
          docker push "$WORKER_IMAGE" &
          worker_push_pid=$!
          wait "$web_push_pid"
          wait "$worker_push_pid"

      - name: Resolve pushed image digests
        id: images
        env:
          WEB_TAG: ${{ steps.metadata.outputs.web_image }}
          WORKER_TAG: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          web_digest="$(gcloud artifacts docker images describe "$WEB_TAG" --format='value(image_summary.digest)')"
          worker_digest="$(gcloud artifacts docker images describe "$WORKER_TAG" --format='value(image_summary.digest)')"
          [[ "$web_digest" == sha256:* ]]
          [[ "$worker_digest" == sha256:* ]]
          web_image="${WEB_TAG%:*}@${web_digest}"
          worker_image="${WORKER_TAG%:*}@${worker_digest}"
          {
            echo "web_image=${web_image}"
            echo "worker_image=${worker_image}"
          } >> "$GITHUB_OUTPUT"

      - name: Plan Cloud Run workload update
        working-directory: infra/gcp/workloads
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_web_image: ${{ steps.images.outputs.web_image }}
          TF_VAR_worker_image: ${{ steps.images.outputs.worker_image }}
          TF_VAR_deployment_target: ${{ env.DEPLOYMENT_TARGET }}
          TF_VAR_allow_unauthenticated: ${{ vars.GCP_IAP_ENABLED != 'true' && github.event_name == 'workflow_dispatch' && inputs.allow_unauthenticated || false }}
          TF_VAR_iap_enabled: ${{ vars.GCP_IAP_ENABLED == 'true' }}
        run: |
          state_prefix="cloud-run"
          if [[ "$DEPLOYMENT_TARGET" == "preview" ]]; then
            state_prefix="cloud-run-preview"
          fi
          terraform init -input=false -reconfigure -backend-config="prefix=${state_prefix}"
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Apply Cloud Run workload update
        working-directory: infra/gcp/workloads
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_web_image: ${{ steps.images.outputs.web_image }}
          TF_VAR_worker_image: ${{ steps.images.outputs.worker_image }}
          TF_VAR_deployment_target: ${{ env.DEPLOYMENT_TARGET }}
          TF_VAR_allow_unauthenticated: ${{ vars.GCP_IAP_ENABLED != 'true' && github.event_name == 'workflow_dispatch' && inputs.allow_unauthenticated || false }}
          TF_VAR_iap_enabled: ${{ vars.GCP_IAP_ENABLED == 'true' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Report failed Cloud Run startup logs
        if: failure()
        run: |
          service_name="keep-and-lease-web"
          if [[ "$DEPLOYMENT_TARGET" == "preview" ]]; then
            service_name="keep-and-lease-preview-web"
          fi
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${service_name}\"" \
            --project="$PROJECT_ID" \
            --freshness=30m \
            --limit=100 \
            --order=desc \
            --format=json

      - name: Resolve deployed web URI
        id: web
        shell: bash
        run: |
          set -euo pipefail
          service_name="keep-and-lease-web"
          if [[ "$DEPLOYMENT_TARGET" == "preview" ]]; then
            service_name="keep-and-lease-preview-web"
          fi

          web_uri=""
          for attempt in 1 2 3 4 5; do
            if web_uri="$(gcloud run services describe "$service_name" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(status.url)')" && \
                [[ "$web_uri" == https://*.run.app ]]; then
              break
            fi
            web_uri=""
            if [[ "$attempt" == 5 ]]; then
              echo "Could not resolve a valid Cloud Run URL for ${service_name}." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

          printf 'web_uri=%s\n' "$web_uri" >> "$GITHUB_OUTPUT"

      - name: Mint Cloud Run identity token
        id: health_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_ENABLED == 'true' && vars.GCP_IAP_CLIENT_ID || steps.web.outputs.web_uri }}
          id_token_include_email: true

      - name: Verify authenticated web health
        id: verify
        env:
          IDENTITY_TOKEN: ${{ steps.health_auth.outputs.id_token }}
          WEB_URI: ${{ steps.web.outputs.web_uri }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${IDENTITY_TOKEN}" \
            "${WEB_URI}/api/v1/health")"
          test "$(jq -r '.status' <<<"$health")" = "ok"
          test "$(jq -r '.execution_backend' <<<"$health")" = "cloud-run-job"
          test "$(jq -r '.engine_commit' <<<"$health")" = "$GITHUB_SHA"
          echo "web_uri=${WEB_URI}" >> "$GITHUB_OUTPUT"
          jq . <<<"$health"

      - name: Prepare browser smoke-test runtime
        shell: bash
        run: |
          set -euo pipefail
          browser_dir="${RUNNER_TEMP}/keep-lease-browser"
          mkdir -p "$browser_dir"
          cp scripts/cloud-agent-browser.cjs "$browser_dir/run.cjs"
          cd "$browser_dir"
          npm init --yes >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check rendered GUI and run multi-commodity strategy
        env:
          KEEP_AND_LEASE_WEB_URI: ${{ steps.verify.outputs.web_uri }}
          KEEP_AND_LEASE_ID_TOKEN: ${{ steps.health_auth.outputs.id_token }}
          KEEP_AND_LEASE_EXPECTED_COMMIT: ${{ github.sha }}
          KEEP_AND_LEASE_RUN_SMOKE_STRATEGY: "true"
          KEEP_AND_LEASE_OUTPUT_DIR: ${{ runner.temp }}/deployment-smoke
        run: |
          set -euo pipefail
          browser_dir="${RUNNER_TEMP}/keep-lease-browser"
          mkdir -p "$KEEP_AND_LEASE_OUTPUT_DIR"
          cd "$browser_dir"
          node run.cjs

      - name: Report failed deployment verification logs
        if: failure()
        run: |
          service_name="keep-and-lease-web"
          calculation_job="keep-and-lease-calculation"
          if [[ "$DEPLOYMENT_TARGET" == "preview" ]]; then
            service_name="keep-and-lease-preview-web"
            calculation_job="keep-and-lease-preview-calculation"
          fi
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${service_name}\"" \
            --project="$PROJECT_ID" \
            --freshness=30m \
            --limit=100 \
            --order=desc \
            --format=json
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${calculation_job}\"" \
            --project="$PROJECT_ID" \
            --freshness=30m \
            --limit=100 \
            --order=desc \
            --format=json

      - name: Upload deployment smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-smoke-${{ env.DEPLOYMENT_TARGET }}-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Publish deployment summary
        env:
          WEB_URI: ${{ steps.verify.outputs.web_uri }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
          SMOKE_REPORT: ${{ runner.temp }}/deployment-smoke/gui-report.json
        run: |
          {
            echo "## Google Cloud deployment"
            echo
            echo "- Target: \`${DEPLOYMENT_TARGET}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Private web service: ${WEB_URI}"
            echo "- IAP enabled: \`${IAP_ENABLED}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Worker image: \`${WORKER_IMAGE}\`"
            echo "- Calculation Job: \`$(terraform -chdir=infra/gcp/workloads output -raw calculation_job)\`"
            echo "- GUI smoke check: \`passed\`"
            echo "- Multi-commodity smoke job: \`$(jq -r '.strategy.jobId' "$SMOKE_REPORT")\`"
            echo "- Smoke-test observations: \`$(jq -r '.strategy.observations' "$SMOKE_REPORT")\`"
          } >> "$GITHUB_STEP_SUMMARY"
