name: Deribit PRD 2 percent search (read only)
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/deribit-prd-2pct-search.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deribit-prd-2pct-search
  cancel-in-progress: false
jobs:
  export:
    if: github.ref == 'refs/heads/agent/cloud-autonomous-access'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-cloud-storage>=2.18,<4' 'cryptography>=43,<47'
      - name: Validate bounded request before authentication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('.cloud-agent/requests/deribit-prd-2pct-search.json').read_text()) == {'schema_version':1,'action':'read-deribit-2pct-search','sequence':1}
          PY
      - uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Read pinned immutable tapes and encrypt
        run: python scripts/export-deribit-prd-2pct-search.py
      - uses: actions/upload-artifact@v4
        with:
          name: deribit-prd-2pct-search-encrypted
          path: encrypted-deribit-2pct-search/
          retention-days: 3
          if-no-files-found: error
