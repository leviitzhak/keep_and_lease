name: Export verified PRD replay inputs
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/prd-input-export.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: prd-verified-input-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-cloud-storage>=2.18,<4'
      - uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Export only verified Dec26 and Mar27 trade files
        run: python -u research/prd_ladder/export_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: prd-verified-dec-mar-inputs
          path: ladder-inputs/
          retention-days: 30
          if-no-files-found: error
