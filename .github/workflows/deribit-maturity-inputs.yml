name: Export BTC maturity metadata
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/deribit-maturity-inputs.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deribit-maturity-metadata
  cancel-in-progress: false
jobs:
  export:
    if: github.ref == 'refs/heads/agent/cloud-autonomous-access'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-cloud-storage>=2.18,<4'
      - uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Read completed archive metadata only
        run: python -u research/deribit_history/export_maturity_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-maturity-inputs
          path: maturity-inputs/
          retention-days: 30
          if-no-files-found: error
