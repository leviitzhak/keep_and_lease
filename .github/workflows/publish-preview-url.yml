name: Publish preview URL

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  publish-preview-url:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Find pull request and publish preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.DEPLOYED_SHA;
            const previewUrl = process.env.PREVIEW_URL;
            const environment = process.env.DEPLOYMENT_ENVIRONMENT || 'Render preview';

            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 }
            );

            if (!pulls.length) {
              core.notice(`No pull request is associated with ${sha}. Deployment URL: ${previewUrl}`);
              return;
            }

            const marker = '<!-- keep-and-lease-render-preview -->';
            const shortSha = sha.slice(0, 7);
            const body = `${marker}\n## Mobile preview\n\n[Open the deployed preview](${previewUrl})\n\n- Environment: \`${environment}\`\n- Commit: \`${shortSha}\`\n- Updated automatically after every successful Render deployment.`;

            for (const pull of pulls.filter(pr => pr.state === 'open')) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pull.number, per_page: 100 }
              );
              const existing = comments.find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull.number,
                  body,
                });
              }
            }
