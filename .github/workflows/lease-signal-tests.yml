name: Lease signal diagnostic tests (no deployment)
on:
  push:
    branches: [agent/operator-results-reader]
    paths: [.cloud-agent/requests/lease-signal-tests.json]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline Parquet validation dependency
        run: python -m pip install pyarrow==25.0.0
      - name: Check diagnostic and original cost tests without cloud access
        run: |
          set -o pipefail
          python -m py_compile scripts/diagnose_lease_signal.py
          python -m unittest tests.test_lease_signal_diagnostic tests.test_diagnose_run_costs tests.test_operator_results_access tests.test_cloud_agent_operator -v 2>&1 | tee lease-signal-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lease-signal-tests-${{ github.run_id }}
          path: lease-signal-tests.log
          retention-days: 7
