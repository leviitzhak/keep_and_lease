name: Audit saved 1OZ full order-book history
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/databento-1oz-audit.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: databento-1oz-audit-fixed-history
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/agent/cloud-autonomous-access'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install -r requirements-databento.txt -r requirements-cloud-databento.txt
      - name: Validate fixed audit and reconstruction checks
        run: |
          python research/databento/audit_1oz_mbo.py --request .cloud-agent/requests/databento-1oz-audit.json --validate-only
          python -m unittest discover -s research/databento -p 'test_audit_1oz_mbo.py'
      - name: Authenticate existing research operator
        uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Audit already saved files without vendor calls
        run: python research/databento/audit_1oz_mbo.py --request .cloud-agent/requests/databento-1oz-audit.json
      - name: Upload encrypted audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-1oz-audit-evidence
          path: gold-audit-evidence/result.encrypted.json
          if-no-files-found: error
          retention-days: 7
