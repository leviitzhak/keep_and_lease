name: Upload and verify BTC trade pilot
on:
  push:
    branches: [agent/cloud-autonomous-access]
    paths: [.cloud-agent/requests/btc-storage.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-trade-storage-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded pilot request
        id: request
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          request = json.loads(Path('.cloud-agent/requests/btc-storage.json').read_text())
          assert set(request) == {'schema_version','action','source_commit'}
          assert request['schema_version'] == 1
          assert request['action'] == 'upload-and-verify-2026-06-25'
          assert re.fullmatch('[0-9a-f]{40}',request['source_commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('source_commit='+request['source_commit']+'\n')
          PY
      - name: Check out pinned implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_commit }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pilot dependencies
        working-directory: research
        run: python -m pip install -r requirements-trade-data.txt
      - name: Download and validate fixed pilot before authentication
        working-directory: research
        run: python scripts/cloud-btc-storage.py prepare
      - name: Authenticate bucket operator through GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: keep-and-lease
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: keep-lease-codex-operator@keep-and-lease.iam.gserviceaccount.com
      - name: Publish immutable inputs and replay from GCS
        working-directory: research
        env:
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        run: python scripts/cloud-btc-storage.py upload-verify
      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-gcs-pilot-${{ github.run_id }}
          path: research/work/cloud-btc-storage/evidence
          if-no-files-found: warn
          retention-days: 14
