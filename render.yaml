services:
  - type: web
    name: keep-and-lease-preview
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "python -m unittest -v test_planned_scoring_and_attribution.py"
    startCommand: "python pr15_preview_server.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    autoDeployTrigger: commit
    previews:
      generation: automatic
      plan: free
